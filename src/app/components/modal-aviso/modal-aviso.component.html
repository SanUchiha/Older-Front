<section class="notice-dialog" aria-labelledby="notice-dialog-title">
  <header class="notice-dialog__header">
    <span class="notice-dialog__icon" aria-hidden="true">
      <mat-icon>error_outline</mat-icon>
    </span>
    <h2 mat-dialog-title id="notice-dialog-title">{{ data.title }}</h2>
    <button mat-icon-button mat-dialog-close type="button" aria-label="Cerrar aviso">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content>
    <p class="notice-dialog__message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-flat-button color="primary" mat-dialog-close type="button">OK</button>
  </mat-dialog-actions>
</section>
